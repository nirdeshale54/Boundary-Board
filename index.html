<title>Boundary Board</title>
<meta name="claude:viewport-fit-sides" content="cover">

<style>
/* Layout: one app shell (Live / Scorer / Admin / Overlays) plus full-bleed stream overlays drawn on fixed canvases and scaled to the window. */
:root{
  --bg:#0c1310;--surface:#131d18;--surface-2:#1b2923;--line:#27382f;--fg:#edf3ee;--muted:#8fa498;
  --accent:#ea4b3c;--on-accent:#fff;--good:#4fc98a;--on-good:#04150c;--warn:#f1b84b;--on-warn:#1a1200;--ring:#7cc4f5;--on-ring:#06121c;

  --ov-panel:#0d1411;--ov-panel-2:#17231d;--ov-fg:#fff;--ov-muted:#a7b9ae;--ov-line:rgba(255,255,255,.16);
  --key:#00b140;
  --abs:radial-gradient(circle at 8% 15%,rgba(255,255,255,.08) 0 12%,transparent 12.5%),radial-gradient(circle at 92% 95%,rgba(255,255,255,.07) 0 20%,transparent 20.5%),radial-gradient(circle at 60% -10%,rgba(234,75,60,.22) 0 22%,transparent 23%),repeating-linear-gradient(115deg,rgba(255,255,255,.04) 0 2px,transparent 2px 28px),linear-gradient(135deg,#0d1411,#17231d);
  color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#f0f4f1;--surface:#fff;--surface-2:#e6ede8;--line:#cdd8d0;--fg:#121b16;--muted:#55695c;
  --accent:#d63a2c;--good:#1f8a57;--on-good:#fff;--warn:#9a6a00;--on-warn:#fff;--ring:#1b6fb0;--on-ring:#fff;color-scheme:light}}
:root[data-theme="light"]{
  --bg:#f0f4f1;--surface:#fff;--surface-2:#e6ede8;--line:#cdd8d0;--fg:#121b16;--muted:#55695c;
  --accent:#d63a2c;--good:#1f8a57;--on-good:#fff;--warn:#9a6a00;--on-warn:#fff;--ring:#1b6fb0;--on-ring:#fff;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 var(--fb)}
html.ov-mode,html.ov-mode body{height:100%;overflow:hidden}

body.ov-mode{background:var(--key)}
.wrap{max-width:1180px;margin:0 auto;padding-block:16px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--fd);text-transform:uppercase;letter-spacing:.04em;margin:0;line-height:1.1;text-wrap:balance}
h2{font-size:26px}h3{font-size:19px;color:var(--muted)}
a{color:inherit}

.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px;padding-bottom:14px;margin-bottom:20px;border-bottom:1px solid var(--line)}

.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs a{text-decoration:none;font:600 15px var(--fb);padding:8px 14px;border-radius:8px;color:var(--muted)}
.tabs a[aria-current="page"]{background:var(--surface-2);color:var(--fg)}
.sync{margin-left:auto;font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px}
.sync i{width:9px;height:9px;border-radius:50%;background:var(--muted)}
.sync.live i{background:var(--good)}.sync.ro i{background:var(--warn)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.grid{display:grid;gap:16px;min-width:0}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}

.stack{display:flex;flex-direction:column;gap:16px}

.muted{color:var(--muted)}.small{font-size:13px}

.fields{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))}

.tm:last-of-type{border-bottom:0}
.tmn{flex:1;min-width:0;display:flex;flex-direction:column}
.tmn b{font:700 26px/1.1 var(--fd);letter-spacing:.03em;text-transform:uppercase;overflow-wrap:anywhere}
.tmn span{color:var(--muted);font-size:13px}

.status{font:600 20px/1.3 var(--fd);letter-spacing:.03em;text-transform:uppercase;padding-top:6px}
.c{display:inline-grid;place-items:center;min-width:34px;height:34px;padding:0 9px;border-radius:99px;font:700 16px var(--fd);font-style:normal;background:var(--surface-2);color:var(--fg);border:1px solid var(--line)}
.c-f{background:var(--ring);color:var(--on-ring);border-color:transparent}
.c-s{background:var(--good);color:var(--on-good);border-color:transparent}
.c-w{background:var(--accent);color:var(--on-accent);border-color:transparent}
.c-x{background:var(--warn);color:var(--on-warn);border-color:transparent}
.chips{display:flex;flex-wrap:wrap;gap:6px;min-height:34px}
.crease{display:grid;gap:8px}
.cr{display:flex;justify-content:space-between;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font:600 22px var(--fd);letter-spacing:.02em}
.cr.on{border-color:var(--accent)}
.cr span{color:var(--muted);font:500 15px var(--fb)}
.runs{display:grid;grid-template-columns:repeat(auto-fit,minmax(66px,1fr));gap:8px}
.runs .btn{font:700 36px/1 var(--fd);padding:18px 0}
.modes{display:flex;flex-wrap:wrap;gap:8px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:center;padding:16px;z-index:20}

.linkrow{display:flex;gap:8px}
.logoup{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.fit{position:fixed;inset:0;overflow:hidden}
.banner{padding:10px 14px;border:1px dashed var(--line);border-radius:8px;color:var(--muted);font-size:14px}
/* ---------- stream overlays (fixed canvas, theme independent) ---------- */
.stage{position:absolute;left:0;top:0;transform-origin:0 0;color:var(--ov-fg);font-family:var(--fd);font-variant-numeric:tabular-nums;line-height:1}
.stage *{box-sizing:border-box}

.bug,.low,.full,.stk{isolation:isolate}
.bug::before,.low::before,.full::before,.stk::before{content:"";position:absolute;inset:-25%;z-index:-1;pointer-events:none;filter:blur(64px);opacity:.6;background:radial-gradient(circle at 14% 35%,var(--ca,#ea4b3c) 0 17%,transparent 18%),radial-gradient(circle at 86% 65%,var(--cb,#2d9cdb) 0 19%,transparent 20%),radial-gradient(circle at 50% 8%,rgba(255,255,255,.35) 0 9%,transparent 10%),radial-gradient(circle at 42% 95%,rgba(255,255,255,.22) 0 11%,transparent 12%)}

.low::before{inset:0;clip-path:inset(0 round 30px)}
.stage .lg.ph{border-color:var(--ov-line);color:var(--ov-muted)}
.stage .c{background:var(--ov-panel-2);color:#fff;border-color:var(--ov-line);min-width:1.9em;height:1.9em;font-size:inherit}

.stage .c-s{background:#4fc98a;color:#04150c;border-color:transparent}
.stage .c-w{background:#ea4b3c;color:#fff;border-color:transparent}
.stage .c-x{background:#f1b84b;color:#1a1200;border-color:transparent}
.stage .chips{gap:8px}
.bug{position:absolute;left:48px;top:40px;display:flex;flex-direction:column;border-radius:26px;overflow:hidden;box-shadow:0 10px 28px rgba(0,0,0,.4);background:var(--abs)}
.bug-1{display:flex;height:96px}

.bug-tm b{font:700 50px/1 var(--fd);letter-spacing:.03em}
.bug-sc{display:flex;align-items:baseline;gap:2px;padding:0 26px;align-self:center}
.bug-sc b{font:800 74px/1 var(--fd)}.bug-sc i{font:600 50px var(--fd);color:var(--ov-muted);padding:0 4px}
.bug-cell{display:flex;flex-direction:column;justify-content:center;gap:6px;padding:0 24px;border-left:1px solid var(--ov-line)}
.bug-cell.tg{background:#fff;color:#0b0f0d;border-left:0;padding:0 30px}.bug-cell.tg small{color:#0b0f0d;opacity:.7}.bug-cell.tg b{font-size:58px}
.bug-cell small{font:600 18px var(--fd);letter-spacing:.14em;color:var(--ov-muted)}
.bug-cell b{font:700 42px/1 var(--fd)}.bug-cell em{font:600 26px var(--fd);color:var(--ov-muted)}
.bug-sp{width:150px;display:grid;place-items:center;padding:12px;background:#fff}
.bug-2{display:flex;align-items:center;gap:30px;height:56px;padding:0 24px;background:rgba(0,0,0,.28);font:600 27px var(--fd);letter-spacing:.02em;white-space:nowrap}
.bug-2 .dim{color:var(--ov-muted)}.bug-2 .chips{margin-left:auto;font-size:24px}
.low{position:absolute;left:56px;right:56px;bottom:56px;height:224px;display:grid;grid-template-columns:250px minmax(0,1.3fr) 400px minmax(0,0.85fr) 250px;grid-template-rows:224px;align-items:stretch;border-radius:30px;box-shadow:0 12px 30px rgba(0,0,0,.45);--ov-muted:rgba(255,255,255,.78);--ov-line:rgba(255,255,255,.28);background:repeating-linear-gradient(115deg,rgba(255,255,255,.06) 0 2px,transparent 2px 28px),linear-gradient(135deg,var(--ca),color-mix(in srgb,var(--ca) 62%,#000))}
.low.res{grid-template-columns:260px minmax(0,1fr) 260px}
.lw-res{display:flex;align-items:center;justify-content:center;text-align:center;font:800 68px/1.05 var(--fd);text-transform:uppercase;letter-spacing:.04em;padding:0 24px;text-wrap:balance}
.lw-res.col{flex-direction:column;gap:10px}
.lw-res .big{font:800 62px/1.05 var(--fd);letter-spacing:.04em;text-transform:uppercase}
.lw-res .sm{font:600 26px/1.1 var(--fd);letter-spacing:.16em;opacity:.85;text-transform:uppercase}
.lw-end{position:relative;display:flex;align-items:center;justify-content:center;padding:0;color:var(--i);border-radius:30px 0 0 30px;background:linear-gradient(90deg,var(--c) 0,var(--c) 62%,transparent 100%)}
.lw-end .lg{margin-block:-28px;transform:translateX(-8px);filter:drop-shadow(0 22px 22px rgba(0,0,0,.55)) drop-shadow(0 4px 6px rgba(0,0,0,.45));z-index:2}
.lw-end.r .lg{transform:translateX(8px)}
.lw-end.r{border-radius:0 30px 30px 0;background:linear-gradient(270deg,var(--c) 0,var(--c) 62%,transparent 100%)}
.lw-end b{font:700 34px/1 var(--fd);letter-spacing:.08em}
.lw-end .lg.mono{background:rgba(0,0,0,.28)!important;color:#fff!important;font-size:104px}
.lw-end small{font:600 18px var(--fd);letter-spacing:.18em;opacity:.8}
.lw-bat,.lw-bowl{display:flex;flex-direction:column;justify-content:center;gap:14px;padding:0 18px 0 30px;min-width:0}
.lw-row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:baseline;gap:16px;font:600 40px/1 var(--fd);letter-spacing:.01em;white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums}
.lw-row>span:first-child{text-align:left;overflow:hidden;text-overflow:ellipsis;min-width:0}

.lw-bowl{background:linear-gradient(90deg,transparent 0,var(--cb) 100%)}
.low:not(.res) .lw-end.r{background:var(--cb)}

.lw-bowl .fg{font:600 23px/1 var(--fd);color:var(--ov-muted);letter-spacing:.04em}

.lw-mid{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:0 16px;text-align:center;border-left:1px solid var(--ov-line);border-right:1px solid var(--ov-line)}
.lw-sc{font:800 86px/1 var(--fd)}.lw-sc i{font-weight:600;color:var(--ov-muted);padding:0 6px}
.lw-ov{font:600 22px/1 var(--fd);white-space:nowrap;letter-spacing:.05em;color:var(--ov-muted)}
.lw-tg{display:flex;align-items:center;gap:12px;background:#fff;color:#0b0f0d;border-radius:14px;padding:4px 18px;font:800 38px/1 var(--fd);letter-spacing:.06em}
.lw-tg small{font:700 20px var(--fd);letter-spacing:.16em;opacity:.7}
.lw-st.long{font-size:20px;-webkit-line-clamp:3}
.lw-st{font:600 24px/1.1 var(--fd);letter-spacing:.04em;text-transform:uppercase;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-width:360px}
.full{position:absolute;inset:0;display:grid;grid-template-rows:auto auto 1fr auto;gap:28px;padding:56px 72px;background:var(--abs)}
.full-h{display:flex;align-items:center;gap:28px}

.full-h .sp{margin-left:auto;height:90px}.full-h .sp img{height:100%;max-width:300px;object-fit:contain}
.full-tm{display:grid;grid-template-columns:1fr 1fr;gap:28px}
.ft{display:flex;align-items:center;gap:28px;padding:24px 32px;background:rgba(0,0,0,.3);border-radius:22px;border-top:8px solid var(--c)}
.ft.dim{opacity:.7}
.ft .n{flex:1;min-width:0}.ft .n b{font:700 50px/1.05 var(--fd);letter-spacing:.03em;text-transform:uppercase;display:block}
.ft .n span{font:500 28px var(--fd);color:var(--ov-muted);display:block;margin-top:8px;letter-spacing:.05em}
.ft .s{font:800 110px/1 var(--fd)}.ft .s i{font-weight:600;color:var(--ov-muted);padding:0 6px}
.full-b{display:grid;grid-template-columns:1.35fr 1fr;gap:28px;min-height:0}

.full-b h4{margin:0 0 14px;font:600 24px var(--fd);letter-spacing:.16em;color:var(--ov-muted);text-transform:uppercase}
.ftbl{width:100%;border-collapse:collapse;font:600 34px var(--fd)}
.ftbl td,.ftbl th{padding:9px 0;text-align:right;border-bottom:1px solid var(--ov-line)}
.ftbl th{font:600 22px var(--fd);letter-spacing:.12em;color:var(--ov-muted)}
.ftbl td:first-child,.ftbl th:first-child{text-align:left}
.ftbl td.d{color:var(--ov-muted);font-size:26px;text-align:left;padding-left:18px}
.full-f{display:flex;align-items:center;gap:24px;font:600 38px var(--fd);letter-spacing:.04em;text-transform:uppercase}
.full-f .chips{margin-left:auto;font-size:34px}

.stk-h{display:flex;align-items:center;gap:26px}
.stk-h b{font:800 54px/1.05 var(--fd);letter-spacing:.04em;text-transform:uppercase;display:block}
.stk-h span{font:500 28px var(--fd);color:var(--ov-muted);letter-spacing:.05em;display:block;margin-top:8px}
.stk-t{display:flex;flex-direction:column;gap:20px}

.stt .n{flex:1;min-width:0}.stt .n b{font:700 48px/1.05 var(--fd);letter-spacing:.03em;text-transform:uppercase;display:block}
.stt .n span{font:500 26px var(--fd);color:var(--ov-muted);display:block;margin-top:8px}
.stt .s{font:800 100px/1 var(--fd)}.stt .s i{font-weight:600;color:var(--ov-muted);padding:0 5px}

.stk.st{padding:96px 72px;gap:56px}.stk.st .stt .s{font-size:120px}.stk.st .stk-s{font-size:54px}.stk.st .stk-p{font-size:44px;gap:20px}

.btn{transition:border-color .12s}

@keyframes in-rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes logo-in{0%{opacity:0;scale:.35}60%{opacity:1;scale:1.08}100%{opacity:1;scale:1}}
@keyframes pop{0%{scale:1}30%{scale:1.22;filter:brightness(1.5)}100%{scale:1}}
@keyframes drift{from{transform:translate3d(-4%,-3%,0) rotate(0deg)}to{transform:translate3d(4%,3%,0) rotate(7deg)}}
@keyframes shine{0%,68%{background-position:160% 0}100%{background-position:-60% 0}}
.stage.enter .bug{animation:in-left .8s cubic-bezier(.2,.8,.2,1) both}
.stage.enter .low{animation:in-up .9s cubic-bezier(.2,.8,.2,1) both}
.stage.enter .full,.stage.enter .stk{animation:in-soft .7s ease-out both}
.stage.enter .lw-end .lg{animation:logo-in .85s cubic-bezier(.2,.9,.3,1.2) .45s both}
.stage.enter .lw-bat{animation:in-rise .6s ease-out .35s both}
.stage.enter .lw-mid{animation:in-rise .6s ease-out .5s both}
.stage.enter .lw-bowl{animation:in-rise .6s ease-out .65s both}
.stage.enter .lw-res>*{animation:in-rise .6s ease-out .5s both}
.stage.enter .ft,.stage.enter .stt{animation:in-rise .6s ease-out .3s both}
.stage.enter .ft+.ft,.stage.enter .stt+.stt{animation-delay:.45s}
.stage .pop{display:inline-block;animation:pop .7s ease-out}
.bug::before,.full::before,.stk::before{animation:drift 16s ease-in-out infinite alternate}
.low::after{content:"";position:absolute;inset:0;border-radius:30px;pointer-events:none;z-index:1;background:linear-gradient(105deg,transparent 42%,rgba(255,255,255,.2) 50%,transparent 58%);background-size:250% 100%;background-position:160% 0;animation:shine 8s ease-in-out infinite}
}
</style>
<div id="app"></div>
<script>
(function(){
'use strict';
/*ENGINE*/
const ov=b=>Math.floor(b/6)+'.'+(b%6);
const mkBat=n=>({name:n,r:0,b:0,f:0,s:0,out:null});
const mkBowl=n=>({name:n,balls:0,r:0,w:0,m:0,cr:0});
const mkInn=bat=>({bat:bat,runs:0,wkts:0,balls:0,ex:{wd:0,nb:0,b:0,lb:0},batters:[],bowlers:[],striker:-1,non:-1,bowler:-1,over:[],overDone:false,fow:[],done:false});
function findOrAdd(list,name,mk){const n=String(name).trim();let i=list.findIndex(x=>x.name.toLowerCase()===n.toLowerCase());if(i<0){list.push(mk(n));i=list.length-1}return i}
function setCrease(S,sk,ns,bw){const inn=S.inn[S.cur];if(sk)inn.striker=findOrAdd(inn.batters,sk,mkBat);if(ns)inn.non=findOrAdd(inn.batters,ns,mkBat);if(bw){inn.bowler=findOrAdd(inn.bowlers,bw,mkBowl);if(inn.overDone){inn.over=[];inn.overDone=false}}}
function nextBatter(S){const inn=S.inn[S.cur];const used=inn.batters.map(b=>b.name.toLowerCase());return S.teams[inn.bat].players.find(p=>!used.includes(p.toLowerCase()))||''}
function applyBall(S,ev){
  const inn=S.inn[S.cur];
  if(!inn||inn.done||inn.striker<0||inn.non<0||inn.bowler<0)return false;
  S.brk='';
  if(inn.overDone){inn.over=[];inn.overDone=false}
  const m=ev.mode||'',n=ev.runs|0,st=inn.batters[inn.striker],bw=inn.bowlers[inn.bowler];
  let total=n,legal=true,t=String(n),k=n===0?'d':n===4?'f':n===6?'s':'r';
  if(n===0)t='•';
  if(m==='wd'){total=n+1;inn.ex.wd+=total;legal=false;bw.r+=total;bw.cr+=total;t=n?'Wd+'+n:'Wd';k='x'}
  else if(m==='nb'){total=n+1;inn.ex.nb+=1;legal=false;st.r+=n;st.b++;bw.r+=total;bw.cr+=total;if(n===4)st.f++;if(n===6)st.s++;t=n?'Nb+'+n:'Nb';k='x'}
  else if(m==='b'||m==='lb'){inn.ex[m]+=n;st.b++;t=(m==='b'?'B':'Lb')+n;k='x'}
  else{st.r+=n;st.b++;bw.r+=n;bw.cr+=n;if(n===4)st.f++;if(n===6)st.s++}
  inn.runs+=total;
  if(legal){inn.balls++;bw.balls++}
  if(ev.wicket){
    const w=ev.wicket,idx=w.who==='non'?inn.non:inn.striker,b=inn.batters[idx];
    const credit=['bowled','caught','lbw','stumped','hit wicket'].indexOf(w.how)>=0;
    b.out={how:w.how,bowler:credit?bw.name:'',fielder:w.fielder||''};
    if(credit)bw.w++;
    inn.wkts++;inn.fow.push({n:inn.wkts,r:inn.runs,name:b.name,ov:ov(inn.balls)});
    t=(n?n:'')+'W';k='w';
    if(w.newBatter&&inn.wkts<10){const ni=findOrAdd(inn.batters,w.newBatter,mkBat);if(w.who==='non')inn.non=ni;else inn.striker=ni}
  }
  inn.over.push({k:k,t:t});
  if(n%2===1){const x=inn.striker;inn.striker=inn.non;inn.non=x}
  if(legal&&inn.balls%6===0){
    if(bw.cr===0)bw.m++;
    inn.bowlers.forEach(x=>{x.cr=0});
    const x=inn.striker;inn.striker=inn.non;inn.non=x;
    inn.lb=inn.bowler;inn.bowler=-1;inn.overDone=true;
  }
  let end=inn.wkts>=10||inn.balls>=S.match.overs*6;
  if(S.cur===1&&inn.runs>=S.target)end=true;
  if(end)finishInnings(S);
  return true;
}
function finishInnings(S){
  const inn=S.inn[S.cur];inn.done=true;S.brk='';
  if(S.cur===0&&S.inn.length===1){S.status='break';S.target=inn.runs+1}
  else{S.status='complete';S.result=resultText(S)}
}
function resultText(S){
  const a=S.inn[0],b=S.inn[1];if(!b)return '';
  const t0=S.teams[a.bat].name,t1=S.teams[b.bat].name;
  if(b.runs>a.runs){const w=10-b.wkts;return t1+' won by '+w+' wicket'+(w===1?'':'s')}
  if(a.runs>b.runs){const r=a.runs-b.runs;return t0+' won by '+r+' run'+(r===1?'':'s')}
  return 'Match tied';
}
function startSecond(S,sk,ns,bw){
  S.inn.push(mkInn(1-S.inn[0].bat));S.cur=1;S.status='live';S.target=S.inn[0].runs+1;
  setCrease(S,sk,ns,bw);
}
function applyToss(S,w,c){
  if(S.cur!==0||S.inn[0].balls>0)return false;
  const bf=c==='bat'?w:1-w;
  S.match.tossWinner=w;S.match.tossChoice=c;S.match.battingFirst=bf;
  S.match.toss=S.teams[w].name+' won the toss and elected to '+(c==='bat'?'bat':'field');
  S.inn=[mkInn(bf)];S.status='live';S.target=0;S.result='';
  return true;
}
function defaultState(){
  return{rev:1,
    event:{name:'Himal Premier Cup',stage:'Match 12 · Group B',venue:'Tundikhel Ground',logo:'',sponsor:''},
    match:{overs:20,battingFirst:0,tossWinner:0,tossChoice:'bat',toss:'Himal Hawks won the toss and elected to bat'},
    teams:[
      {name:'Himal Hawks',short:'HHK',color:'#e8473a',logo:'',players:['A. Thapa','R. Karki','S. Gurung','P. Shrestha','B. Rai','N. Magar','K. Adhikari','M. Tamang','D. Basnet','S. Limbu','T. Bhandari']},
      {name:'Terai Tigers',short:'TTG',color:'#2d9cdb',logo:'',players:['J. Khadka','L. Poudel','H. Chaudhary','V. Sharma','G. Oli','C. Pun','R. Bista','U. Dahal','P. Joshi','M. Subedi','Y. Rana']}
    ],
    ov:{key:'green',showSponsor:true},
    brk:'',
    schedule:[{id:'s1',a:'Himal Hawks',b:'Mustang Mavericks',when:'2026-11-20T14:00',venue:'Tundikhel Ground',stage:'Match 13 \u00B7 Group B',overs:20},{id:'s2',a:'Terai Tigers',b:'Koshi Kings',when:'2026-11-22T10:30',venue:'Pokhara Rangasala',stage:'Match 14 \u00B7 Group A',overs:20}],
    inn:[mkInn(0)],cur:0,status:'live',target:0,result:''};
}
function seed(){
  const S=defaultState(),inn=S.inn[0],bl=S.teams[1].players,order=[bl[10],bl[9],bl[8],bl[7],bl[6]];
  let bi=0;setCrease(S,S.teams[0].players[0],S.teams[0].players[1],order[0]);
  const toks='0 1 4 0 1 1 2 Wd 0 6 1 0 4 W 1 0 2 4 1 0 0 1 1 6 0 4 1 Nb 2 W 0 1 1 B1 4 0 2 1 6'.split(' ');
  toks.forEach(t=>{
    if(inn.bowler<0){bi++;setCrease(S,null,null,order[bi%order.length])}
    let ev;
    if(t==='W')ev={runs:0,wicket:{how:'caught',who:'striker',fielder:'',newBatter:nextBatter(S)}};
    else if(t==='Wd')ev={mode:'wd',runs:0};
    else if(t==='Nb')ev={mode:'nb',runs:0};
    else if(t[0]==='B')ev={mode:'b',runs:+t.slice(1)};
    else ev={runs:+t};
    applyBall(S,ev);
  });
  return S;
}
/*ENDENGINE*/

/* ---------- helpers ---------- */
const app=document.getElementById('app');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function ink(hex){const h=String(hex||'#888888').replace('#','');const n=parseInt(h.length===3?h.split('').map(x=>x+x).join(''):h,16)||0;return(0.299*(n>>16)+0.587*(n>>8&255)+0.114*(n&255))>150?'#0b0f0d':'#ffffff'}
function setPath(o,p,v){const k=p.split('.');let c=o;for(let i=0;i<k.length-1;i++)c=c[k[i]];c[k[k.length-1]]=v}
const KEY='boundary-board-v1';
function load(){try{const t=localStorage.getItem(KEY);return t?JSON.parse(t):null}catch(e){return null}}
function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
let S=load()||seed();
const undo=[];
const ui={mode:'',wk:null,arm:'',err:''};
let sync='local',pending=false;
const bc=(function(){try{return typeof BroadcastChannel!=='undefined'?new BroadcastChannel('boundary-board'):null}catch(e){return null}})();
if(bc)bc.onmessage=e=>{const r=e.data;if(r&&r.rev>S.rev){S=r;saveLocal();render()}};

/* ---------- shared sync ---------- */
let docRef=null,pushing=false,dirty=false,pt=0;
function setSync(v){sync=v;const el=document.getElementById('sync');if(el){el.className='sync '+v;el.lastChild.textContent=SYNCTXT[v]}}
const SYNCTXT={live:'Synced to all viewers',local:'This device only',ro:'Not saving online (view access)'};
function schedulePush(){if(!docRef)return;clearTimeout(pt);pt=setTimeout(doPush,200)}
async function doPush(){
  if(pushing){dirty=true;return}
  pushing=true;
  try{await docRef.set({rev:S.rev,at:Date.now(),state:JSON.stringify(S)});setSync('live')}
  catch(e){setSync('ro')}
  finally{pushing=false;if(dirty){dirty=false;schedulePush()}}
}
async function initSync(){
  try{
    if(!window.claude||!window.claude.use)return;
    const db=await window.claude.use('db');
    if(!db)return;
    docRef=db.doc('match/current');
    let first=true;
    const timer=setTimeout(()=>setSync('local'),10000);
    docRef.onSnapshot(snap=>{
      clearTimeout(timer);
      const writer=/^(scorer|admin|overlays)$/.test(route());
      if(snap.exists){
        let r=null;try{r=JSON.parse(snap.data().state)}catch(e){}
        if(r&&r.rev>S.rev){S=r;saveLocal();render()}
        else if(first&&r&&r.rev<S.rev&&writer)schedulePush();
      }else if(first&&writer&&S.rev>1)schedulePush();
      first=false;setSync(sync==='ro'?'ro':'live');
    },()=>setSync('local'));
  }catch(e){setSync('local')}
}
function commit(fn,undoable){
  const snap=JSON.stringify(S);
  if(fn(S)===false)return false;
  if(undoable){undo.push(snap);if(undo.length>80)undo.shift()}
  S.rev++;saveLocal();
  try{if(bc)bc.postMessage(S)}catch(e){}
  schedulePush();render(true);return true;
}
function doUndo(){
  const s=undo.pop();if(!s)return;
  const rev=S.rev;S=JSON.parse(s);S.rev=rev+1;saveLocal();
  try{if(bc)bc.postMessage(S)}catch(e){}
  schedulePush();render(true);
}

/* ---------- derived view data ---------- */
function teamLine(t){const i=S.inn.find(x=>x.bat===t);return i?{runs:i.runs,wkts:i.wkts,ov:ov(i.balls),inn:i}:null}
function V(S){
  const inn=S.inn[S.cur]||null,bi=inn?inn.bat:S.match.battingFirst;
  const o={S:S,inn:inn,bt:S.teams[bi],bl:S.teams[1-bi]};
  if(inn){
    o.score=inn.runs+'/'+inn.wkts;o.overs=ov(inn.balls);o.crr=inn.balls?(inn.runs*6/inn.balls).toFixed(2):'0.00';
    o.st=inn.batters[inn.striker]||null;o.ns=inn.batters[inn.non]||null;
    o.bw=inn.bowlers[inn.bowler]||(inn.overDone?(inn.bowlers[inn.lb]||inn.bowlers[inn.bowlers.length-1]):null)||null;
    if(S.cur===1){o.need=S.target-inn.runs;o.left=S.match.overs*6-inn.balls}
  }
  if(S.status==='complete')o.status=S.result;
  else if(S.status==='break'){const a=S.inn[0];o.status='Innings break · '+S.teams[1-a.bat].short+' need '+S.target+' to win'}
  else if(S.cur===1)o.status=o.need>0?o.bt.short+' need '+o.need+' off '+o.left+' ball'+(o.left===1?'':'s'):o.bt.short+' have won';
  else o.status=S.match.toss||('CRR '+o.crr);
  if(S.brk&&S.status==='live')o.status=S.brk;
  return o;
}
function dismissal(b){
  if(!b.out)return 'not out';const x=b.out,f=x.fielder||'sub';
  switch(x.how){case 'bowled':return 'b '+x.bowler;case 'caught':return 'c '+f+' b '+x.bowler;case 'lbw':return 'lbw b '+x.bowler;
    case 'stumped':return 'st '+f+' b '+x.bowler;case 'run out':return 'run out'+(x.fielder?' ('+x.fielder+')':'');default:return 'hit wkt b '+x.bowler}
}
const chipsHtml=inn=>inn?inn.over.map(c=>'<i class="c c-'+c.k+'">'+esc(c.t)+'</i>').join(''):'';
function lg(t,sz){return t.logo?'<span class="lg" style="--s:'+sz+'px"><img alt="" src="'+t.logo+'"></span>':'<span class="lg mono" style="--s:'+sz+'px;background:'+esc(t.color)+';color:'+ink(t.color)+'">'+esc(t.short.slice(0,3))+'</span>'}
function evLogo(S,sz){
  const e=S.event;if(e.logo)return '<span class="lg" style="--s:'+sz+'px"><img alt="" src="'+e.logo+'"></span>';
  const ini=e.name.split(/\s+/).map(w=>w[0]||'').join('').slice(0,3).toUpperCase();
  return '<span class="lg ph" style="--s:'+sz+'px">'+esc(ini||'LOGO')+'</span>';
}
const spImg=S=>(S.ov.showSponsor&&S.event.sponsor)?'<img alt="" src="'+S.event.sponsor+'">':'';
const figs=b=>ov(b.balls)+'-'+b.m+'-'+b.r+'-'+b.w;

/* ---------- live view ---------- */
function battingTable(inn,S){
  const rows=inn.batters.map((b,i)=>{
    const here=!b.out&&(i===inn.striker||i===inn.non)&&!inn.done;
    return '<tr class="'+(here?'now':'')+'"><td>'+esc(b.name)+(i===inn.striker&&here?' *':'')+'</td><td class="how">'+esc(dismissal(b))+'</td><td>'+b.r+'</td><td>'+b.b+'</td><td>'+b.f+'</td><td>'+b.s+'</td><td>'+(b.b?(b.r*100/b.b).toFixed(1):'-')+'</td></tr>';
  }).join('');
  const ex=inn.ex,exT=ex.wd+ex.nb+ex.b+ex.lb;
  return '<div class="scroll"><table class="tbl"><tr><th>Batter</th><th class="how"></th><th>R</th><th>B</th><th>4s</th><th>6s</th><th>SR</th></tr>'+rows+
   '<tr><td>Extras</td><td class="how">wd '+ex.wd+', nb '+ex.nb+', b '+ex.b+', lb '+ex.lb+'</td><td>'+exT+'</td><td></td><td></td><td></td><td></td></tr>'+
   '<tr><td><b>Total</b></td><td class="how">'+ov(inn.balls)+' overs</td><td><b>'+inn.runs+'/'+inn.wkts+'</b></td><td></td><td></td><td></td><td></td></tr></table></div>';
}
function bowlingTable(inn){
  return '<div class="scroll"><table class="tbl"><tr><th>Bowler</th><th>O</th><th>M</th><th>R</th><th>W</th><th>Econ</th></tr>'+
   inn.bowlers.map(b=>'<tr><td>'+esc(b.name)+'</td><td>'+ov(b.balls)+'</td><td>'+b.m+'</td><td>'+b.r+'</td><td>'+b.w+'</td><td>'+(b.balls?(b.r*6/b.balls).toFixed(2):'-')+'</td></tr>').join('')+'</table></div>'+
   (inn.fow.length?'<p class="small muted">Fall of wickets: '+inn.fow.map(f=>f.n+'-'+f.r+' ('+esc(f.name)+', '+f.ov+')').join(' · ')+'</p>':'');
}
function abbr(n){const w=String(n).trim().split(/\s+/).filter(Boolean);return(w.length>1?w.map(x=>x[0]).join('').slice(0,3):(w[0]||'TBD').slice(0,3)).toUpperCase()}
function fmtWhen(w){const d=new Date(w);return isNaN(d)?w:d.toLocaleString([],{weekday:'short',day:'numeric',month:'short',hour:'numeric',minute:'2-digit'})}
function sched(){return(S.schedule||[]).slice().sort((x,y)=>String(x.when).localeCompare(String(y.when)))}
function fixtureRow(f,admin){
  const arm=ui.arm==='sch-use:'+f.id;
  return '<div class="tm" style="align-items:flex-start;flex-wrap:wrap"><div class="tmn" style="min-width:200px"><b style="font-size:22px">'+esc(f.a)+' v '+esc(f.b)+'</b><span>'+esc(fmtWhen(f.when))+' \u00B7 '+esc(f.venue)+' \u00B7 '+esc(f.stage)+' \u00B7 '+(f.overs|0)+' overs</span></div>'+
   (admin?'<div class="row"><button class="btn" data-act="sch-use" data-id="'+esc(f.id)+'" data-arm="1">'+(arm?'Tap again: replaces current match':'Set up this match')+'</button><button class="btn" data-act="sch-del" data-id="'+esc(f.id)+'">Remove</button></div>':'')+'</div>';
}
function upcomingCard(){
  const l=sched();if(!l.length)return '';
  return '<div class="card stack" style="margin-top:16px"><h2>Upcoming matches</h2><div>'+l.map(f=>fixtureRow(f,false)).join('')+'</div></div>';
}
function scheduleCard(){
  const l=sched(),d=ui.sc||{};
  return '<div class="card stack"><h2>Schedule</h2><div class="fields"><label>Team A<input id="sc-a" placeholder="Team name" value="'+esc(d.a)+'"></label><label>Team B<input id="sc-b" placeholder="Team name" value="'+esc(d.b)+'"></label>'+
   '<label>Date and time<input id="sc-when" type="datetime-local" value="'+esc(d.when)+'"></label><label>Venue<input id="sc-venue" value="'+esc(d.venue!=null?d.venue:S.event.venue)+'"></label>'+
   '<label>Stage or match number<input id="sc-stage" placeholder="Match 15 \u00B7 Semi-final" value="'+esc(d.stage)+'"></label><label>Overs<input id="sc-ov" type="number" min="1" max="50" value="'+(d.overs||S.match.overs)+'"></label></div>'+
   (ui.err&&ui.errAt==='sch'?'<div class="err">'+esc(ui.err)+'</div>':'')+
   '<div><button class="btn pri" data-act="sch-add">Add to schedule</button></div>'+
   (l.length?'<div>'+l.map(f=>fixtureRow(f,true)).join('')+'</div>':'<div class="small muted">No matches scheduled yet.</div>')+
   '<p class="small muted" style="margin:0">"Set up this match" fills in the teams, venue, stage and overs, and starts a fresh match. Teams with a new name start with an empty player list, so type the batters and bowlers in the Scorer panel.</p></div>';
}
function liveView(){
  const o=V(S),inn=o.inn;
  const rows=[0,1].map(t=>{const T=S.teams[t],L=teamLine(t),on=S.status==='live'&&o.bt===T;
    return '<div class="tm">'+lg(T,56)+'<div class="tmn"><b>'+esc(T.name)+(on?'<em class="tag">Batting</em>':'')+'</b><span>'+(L?L.ov+' overs':'Yet to bat')+'</span></div><div class="tms">'+(L?L.runs+'<i>/'+L.wkts+'</i>':'–')+'</div></div>'}).join('');
  let h='<div class="grid g2"><div class="card hero"><div class="row" style="justify-content:space-between"><h3>'+esc(S.event.name)+' · '+esc(S.event.stage)+'</h3><span class="small muted">'+esc(S.event.venue)+'</span></div>'+rows+'<div class="status">'+esc(o.status)+'</div></div>';
  if(inn&&S.status!=='complete'&&S.status!=='break'){
    h+='<div class="card stack"><h3>At the crease</h3><div class="crease">'+
      (o.st?'<div class="cr on">'+esc(o.st.name)+' *<span>'+o.st.r+' ('+o.st.b+') · '+o.st.f+'x4 '+o.st.s+'x6</span></div>':'')+
      (o.ns?'<div class="cr">'+esc(o.ns.name)+'<span>'+o.ns.r+' ('+o.ns.b+')</span></div>':'')+
      (o.bw?'<div class="cr">'+esc(o.bw.name)+'<span>'+figs(o.bw)+'</span></div>':'')+'</div>'+
      '<div><div class="small muted" style="margin-bottom:6px">This over</div><div class="chips">'+chipsHtml(inn)+'</div></div>'+
      '<div class="small muted">Run rate '+o.crr+(S.cur===1&&o.left>0?' · Required '+(o.need*6/o.left).toFixed(2):'')+'</div></div>';
  }
  h+='</div><div class="stack" style="margin-top:16px">';
  S.inn.slice().reverse().forEach((i,k)=>{const T=S.teams[i.bat];h+='<details class="card" '+(k===0?'open':'')+'><summary style="cursor:pointer;font:700 22px var(--fd);text-transform:uppercase;letter-spacing:.04em">'+esc(T.name)+' · '+i.runs+'/'+i.wkts+' ('+ov(i.balls)+')</summary><div class="stack" style="margin-top:12px">'+battingTable(i,S)+bowlingTable(i)+'</div></details>'});

   '<div class="bug-sc"><b>'+inn.runs+'</b><i>/</i><b>'+inn.wkts+'</b></div><div class="bug-cell"><small>OVERS</small><b>'+o.overs+' <em>/ '+S.match.overs+'</em></b></div><div class="bug-cell'+tg+'">'+sec+'</div>'+(sp?'<div class="bug-sp">'+sp+'</div>':'')+'</div><div class="bug-2">'+r2+'</div></div>';

function ovLower(o){
  const S=o.S,inn=o.inn;if(!inn)return '';
  if(S.status==='complete'&&S.inn.length>1){
    const A=S.inn[0],B=S.inn[1],w=B.runs>A.runs?B.bat:A.runs>B.runs?A.bat:-1;
    const col=w>=0?S.teams[w].color:'#3a4a41';
    const ends=t=>'<div class="lw-end'+(t===B.bat?' r':'')+'" style="--c:'+esc(S.teams[t].color)+';--i:'+ink(S.teams[t].color)+'">'+lg(S.teams[t],280)+'</div>';
    return '<div class="low res" style="--ca:'+esc(col)+'">'+ends(A.bat)+'<div class="lw-res">'+esc(S.result)+'</div>'+ends(B.bat)+'</div>';
  }
  const endsOf=(L,R)=>'<div class="lw-end" style="--c:'+esc(L.color)+';--i:'+ink(L.color)+'">'+lg(L,280)+'</div>';
  const endR=R=>'<div class="lw-end r" style="--c:'+esc(R.color)+';--i:'+ink(R.color)+'">'+lg(R,280)+'</div>';
  if(S.brk&&S.status==='live'&&inn){
    return '<div class="low res" style="--ca:'+esc(o.bt.color)+';--cb:'+esc(o.bl.color)+'">'+endsOf(o.bt)+'<div class="lw-res col"><div class="sm">'+esc(S.brk)+'</div><div class="big">'+esc(o.bt.name)+' '+inn.runs+'/'+inn.wkts+'</div>'+(S.cur===1?'<div class="lw-tg"><small>TARGET</small>'+S.target+'<small>'+o.overs+' OV</small></div>':'<div class="sm">'+o.overs+' OVERS</div>')+'</div>'+endR(o.bl)+'</div>';
  }
  if(S.status==='break'&&S.inn.length===1){
    const A=S.inn[0],T=S.teams[A.bat],U=S.teams[1-A.bat];
    return '<div class="low res" style="--ca:'+esc(T.color)+';--cb:'+esc(U.color)+'">'+endsOf(T)+'<div class="lw-res col"><div class="sm">INNINGS BREAK</div><div class="big">'+esc(T.name)+' '+A.runs+'/'+A.wkts+'</div><div class="lw-tg"><small>TARGET</small>'+S.target+'<small>'+ov(A.balls)+' OV</small></div></div>'+endR(U)+'</div>';
  }
  const pre=S.status==='live'&&(!o.st||!o.ns||(inn.balls===0&&!o.bw));
  if(pre){
    return '<div class="low res">'+endsOf(o.bt)+'<div class="lw-res col"><div class="big">'+esc(o.bt.name)+' <span style="opacity:.7">v</span> '+esc(o.bl.name)+'</div>'+(S.cur===1?'<div class="lw-tg"><small>TARGET</small>'+S.target+'</div>':(S.match.toss?'<div class="sm">'+esc(S.match.toss)+'</div>':''))+'</div>'+endR(o.bl)+'</div>';
  }
  const live=S.status==='live'&&o.st&&o.ns;
  const row=(b,star)=>'<div class="lw-row"><span>'+esc(b.name)+(star?' *':'')+'</span><span><b>'+b.r+'</b> <span class="dim">('+b.b+')</span></span></div>';
  const bats=live?row(o.st,1)+row(o.ns,0):'<div class="lw-row"><span>'+esc(S.event.name)+'</span></div>';
  const bowl=(live&&o.bw?'<div class="br"><span class="nm">'+esc(o.bw.name)+'</span><span class="fg">'+figs(o.bw)+'</span></div>':'')+'<small>THIS OVER</small><div class="chips">'+chipsHtml(inn)+'</div>';
  const chase=S.cur===1&&S.status==='live';
  const st=chase?(o.need>0?'NEED '+o.need+' OFF '+o.left+' BALLS':o.status):o.status;
  const mid=(chase?'<div class="lw-tg"><small>TARGET</small>'+S.target+'</div>':'')+'<div class="lw-ov">'+o.overs+' OV \u00B7 CRR '+o.crr+(chase&&o.left>0&&o.need>0?' \u00B7 RRR '+(o.need*6/o.left).toFixed(2):'')+'</div>';
  const end=(T,r)=>'<div class="lw-end'+(r?' r':'')+'" style="--c:'+esc(T.color)+';--i:'+ink(T.color)+'">'+lg(T,280)+'</div>';
  return '<div class="low">'+end(o.bt,0)+'<div class="lw-bat">'+bats+'</div><div class="lw-mid"><div class="lw-sc">'+inn.runs+'<i>/</i>'+inn.wkts+'</div>'+mid+'<div class="lw-st'+(st.length>30?' long':'')+'">'+esc(st)+'</div></div><div class="lw-bowl">'+bowl+'</div>'+end(o.bl,1)+'</div>';
}

  let h='<div class="stack"><div class="card stack"><h2>Stream overlays</h2><p class="muted" style="margin:0;max-width:70ch">Each overlay has its own link: add the name after # on this page\'s address. Open it full size in your streaming software\'s browser source, set to the size shown, then remove the background with a colour key. Press Esc on an overlay to come back here.</p>'+
   '<div class="fields"><label>Background behind overlays<select data-path="ov.key"><option value="green"'+(S.ov.key==='green'?' selected':'')+'>Green (key it out)</option><option value="blue"'+(S.ov.key==='blue'?' selected':'')+'>Blue (key it out)</option><option value="magenta"'+(S.ov.key==='magenta'?' selected':'')+'>Magenta (key it out)</option><option value="dark"'+(S.ov.key==='dark'?' selected':'')+'>Dark (no keying)</option></select></label>'+
   '<label class="chk" style="align-self:end"><input type="checkbox" data-path="ov.showSponsor"'+(S.ov.showSponsor?' checked':'')+'> Show sponsor logo on overlays</label></div></div><div class="grid g2">';
  Object.keys(OVL).forEach(k=>{const d=OVL[k];
    h+='<div class="card tile"><h3 style="color:var(--fg)">'+d[0]+' <span class="muted small" style="font-family:var(--fb);letter-spacing:0;text-transform:none">'+d[2]+' × '+d[3]+'</span></h3><p class="muted small" style="margin:6px 0 0">'+d[1]+'</p>'+
     '<div class="thumb" data-fit="box" data-w="'+d[2]+'" data-h="'+d[3]+'" style="aspect-ratio:'+d[2]+'/'+d[3]+';'+(k==='story'?'max-width:240px':'')+'">'+stage(k)+'</div>'+
     '<div class="linkrow"><input readonly id="lk-'+k+'" value="'+esc(base+'#overlay-'+k)+'" aria-label="Link"><button class="btn" data-act="copy" data-k="'+k+'">Copy</button><a class="btn" href="#overlay-'+k+'" style="text-decoration:none">Open</a></div></div>'});
  return h+'</div></div>';
}
function fitAll(){
  document.querySelectorAll('[data-fit]').forEach(c=>{
    const w=+c.dataset.w,h=+c.dataset.h,s=c.firstElementChild;if(!s||!c.clientWidth)return;
    if(c.dataset.fit==='win'){const k=Math.min(c.clientWidth/w,c.clientHeight/h);s.style.transform='scale('+k+')';s.style.left=(c.clientWidth-w*k)/2+'px';s.style.top=(c.clientHeight-h*k)/2+'px'}
    else s.style.transform='scale('+(c.clientWidth/w)+')';
  });
}

/* ---------- shell and routing ---------- */
const route=()=>(location.hash||'#live').slice(1);
function shell(body,r){
  const tabs=[['live','Live'],['scorer','Scorer'],['admin','Admin'],['overlays','Overlays']];
  return '<div class="wrap"><header class="top"><div class="brand"><i></i>Boundary Board</div><nav class="tabs" aria-label="Sections">'+tabs.map(t=>'<a href="#'+t[0]+'"'+(r===t[0]?' aria-current="page"':'')+'>'+t[1]+'</a>').join('')+'</nav><div class="sync '+sync+'" id="sync"><i></i><span>'+SYNCTXT[sync]+'</span></div></header>'+body+'</div>';
}
let ovSeen='';const popPrev=new Map();
const POPS=['.lw-sc','.lw-row>span:nth-child(2)','.lw-bowl .fg','.lw-tg','.lw-st','.lw-res .big','.bug-sc','.bug-cell b','.ft .s','.stt .s','.chips'];
function animateOv(r){
  const st=app.querySelector('.stage');if(!st)return;
  const first=ovSeen!==r;
  if(first){ovSeen=r;popPrev.clear();st.classList.add('enter')}
  POPS.forEach(sel=>st.querySelectorAll(sel).forEach((el,i)=>{
    const key=sel+'#'+i;let target=el,val=el.textContent;
    if(sel==='.chips'){target=el.lastElementChild;val=el.children.length+'|'+val;if(!target){popPrev.set(key,val);return}}
    if(!first&&popPrev.has(key)&&popPrev.get(key)!==val)target.classList.add('pop');
    popPrev.set(key,val);
  }));
}
function render(force){
  const r=route(),ae=document.activeElement;
  if(!force&&ae&&/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)&&app.contains(ae)){pending=true;return}
  pending=false;
  const isOv=r.indexOf('overlay-')===0;
  document.documentElement.classList.toggle('ov-mode',isOv);
  document.body.classList.toggle('ov-mode',isOv);
  document.body.dataset.key=S.ov.key;
  if(isOv){const k=OVL[r.slice(8)]?r.slice(8):'bug',d=OVL[k];app.innerHTML='<div class="fit" data-fit="win" data-w="'+d[2]+'" data-h="'+d[3]+'">'+stage(k)+'</div>';animateOv(r)}
  else{
    ovSeen='';
    const v=r==='scorer'?scorerView():r==='admin'?adminView():r==='overlays'?overlaysView():liveView();
    app.innerHTML=shell(v,OVL[r]||['scorer','admin','overlays'].indexOf(r)>=0?r:'live');
  }
  fitAll();
}

/* ---------- events ---------- */
async function readLogo(file){
  const url=URL.createObjectURL(file),img=new Image();
  try{
    await new Promise((res,rej)=>{img.onload=res;img.onerror=rej;img.src=url});
    const W=img.naturalWidth||256,H=img.naturalHeight||256;
    for(const sz of [192,128,96]){
      const sc=Math.min(1,sz/Math.max(W,H)),c=document.createElement('canvas');
      c.width=Math.max(1,Math.round(W*sc));c.height=Math.max(1,Math.round(H*sc));
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      let d=c.toDataURL('image/webp',.9);if(d.indexOf('data:image/webp')!==0)d=c.toDataURL('image/png');
      if(d.length<60000)return d;
    }
  }catch(e){}finally{URL.revokeObjectURL(url)}
  return null;
}
app.addEventListener('change',async e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.logo){
    const f=t.files&&t.files[0];if(!f)return;
    const d=await readLogo(f);
    if(d)commit(s=>setPath(s,t.dataset.logo,d));else{ui.err='That logo could not be read or is too large.';render(true)}
    return;
  }
  if(t.dataset&&t.dataset.toss){
    const w=parseInt(val('t-win'),10)||0,c=val('t-ch')==='field'?'field':'bat';
    if(!commit(s=>applyToss(s,w,c)))render(true);
    return;
  }
  if(t.dataset&&t.dataset.path){
    let v=t.type==='checkbox'?t.checked:t.value;const k=t.dataset.kind;
    if(k==='num')v=Math.max(1,Math.min(50,parseInt(v,10)||20));
    if(k==='int')v=parseInt(v,10)||0;
    if(k==='short')v=String(v).toUpperCase().slice(0,4);
    if(k==='lines')v=String(v).split('\n').map(x=>x.trim()).filter(Boolean);
    commit(s=>setPath(s,t.dataset.path,v));
  }
});
app.addEventListener('focusout',()=>{if(pending)setTimeout(()=>{const ae=document.activeElement;if(!(ae&&/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)))render(true)},0)});
let armTimer=0;
app.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,d=b.dataset;
  const key=a+(d.id?':'+d.id:'');
  if(d.arm&&ui.arm!==key){ui.arm=key;clearTimeout(armTimer);armTimer=setTimeout(()=>{ui.arm='';render(true)},4000);render(true);return}
  ui.arm='';
  switch(a){
    case 'mode':ui.mode=ui.mode===d.m?'':d.m;render(true);break;
    case 'run':applyEv({mode:ui.mode,runs:+d.n});break;
    case 'undo':doUndo();break;
    case 'brk-start':commit(s=>{s.brk=val('brk-sel')||'Break'});break;
    case 'brk-end':commit(s=>{s.brk=''});break;
    case 'swap':commit(s=>{const i=s.inn[s.cur];const x=i.striker;i.striker=i.non;i.non=x},true);break;
    case 'end-inn':commit(s=>{finishInnings(s)},true);break;
    case 'wkt-open':ui.err='';ui.wk={how:'bowled',who:'striker',runs:0,fielder:'',nb:nextBatter(S)};render(true);break;
    case 'wkt-cancel':ui.wk=null;ui.err='';render(true);break;
    case 'wkt-ok':{
      const how=val('w-how'),who=val('w-who'),runs=how==='run out'?Math.max(0,Math.min(6,parseInt(val('w-runs'),10)||0)):0,nb=val('w-new');
      const last=S.inn[S.cur].wkts+1>=10;
      if(!nb&&!last){ui.err='Enter the incoming batter.';ui.wk={how:how,who:who,runs:runs,fielder:val('w-fld'),nb:''};render(true);break}
      ui.err='';ui.wk=null;
      applyEv({mode:ui.mode,runs:runs,wicket:{how:how,who:who,fielder:val('w-fld'),newBatter:nb}});break}
    case 'crease-ok':{
      const sk=val('f-sk'),ns=val('f-ns'),bw=val('f-bw'),i=S.inn[S.cur];
      if((i.striker<0&&!sk)||(i.non<0&&!ns)||(i.bowler<0&&!bw)){ui.err='Fill in every name shown.';render(true);break}
      if(sk&&ns&&sk.toLowerCase()===ns.toLowerCase()){ui.err='Striker and non-striker must be different players.';render(true);break}
      ui.err='';commit(s=>setCrease(s,sk,ns,bw),true);break}
    case 'start2':{
      const sk=val('f-sk'),ns=val('f-ns'),bw=val('f-bw');
      if(!sk||!ns||!bw){ui.err='Fill in every name shown.';render(true);break}
      if(sk.toLowerCase()===ns.toLowerCase()){ui.err='Striker and non-striker must be different players.';render(true);break}
      ui.err='';commit(s=>startSecond(s,sk,ns,bw),true);break}
    case 'apply-setup':undo.length=0;commit(s=>{s.brk='';s.inn=[mkInn(s.match.battingFirst)];s.cur=0;s.status='live';s.target=0;s.result=''});location.hash='scorer';break;
    case 'sch-add':{
      const f={id:Date.now().toString(36),a:val('sc-a'),b:val('sc-b'),when:val('sc-when'),venue:val('sc-venue'),stage:val('sc-stage'),overs:Math.max(1,Math.min(50,parseInt(val('sc-ov'),10)||20))};
      if(!f.a||!f.b||!f.when){ui.err='Enter both team names and a date and time.';ui.errAt='sch';ui.sc=f;render(true);break}
      ui.err='';ui.sc=null;commit(s=>{s.schedule=(s.schedule||[]).concat([f])});break}
    case 'sch-del':commit(s=>{s.schedule=(s.schedule||[]).filter(x=>x.id!==d.id)});break;
    case 'sch-use':{
      const f=(S.schedule||[]).find(x=>x.id===d.id);if(!f)break;
      undo.length=0;
      commit(s=>{
        [f.a,f.b].forEach((n,i)=>{const T=s.teams[i];if(T.name.toLowerCase()!==n.toLowerCase()){T.name=n;T.short=abbr(n);T.players=[];T.logo=''}});
        s.event.stage=f.stage||s.event.stage;s.event.venue=f.venue||s.event.venue;s.match.overs=f.overs|0||20;
        s.inn=[mkInn(0)];s.cur=0;s.status='live';s.target=0;s.result='';applyToss(s,0,'bat');
      });
      location.hash='scorer';break}
    case 'clear-logo':commit(s=>setPath(s,d.p,''));break;
    case 'copy':{
      const el=document.getElementById('lk-'+d.k);if(!el)break;
      const fall=()=>{el.focus();el.select()};
      try{navigator.clipboard.writeText(el.value).then(()=>{b.textContent='Copied';setTimeout(()=>{b.textContent='Copy'},1500)},fall)}catch(x){fall()}
      break}
  }
});
document.addEventListener('keydown',e=>{
  const r=route();
  if(r.indexOf('overlay-')===0&&e.key==='Escape'){location.hash='overlays';return}
  if(r!=='scorer'||e.ctrlKey||e.metaKey||e.altKey)return;
  const ae=document.activeElement;if(ae&&/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName))return;
  const i=S.inn[S.cur];if(!i||S.status!=='live'||ui.wk)return;
  if(e.key==='u'||e.key==='U'){doUndo();return}
  if(i.striker<0||i.non<0||i.bowler<0)return;
  if(/^[0-6]$/.test(e.key))applyEv({mode:ui.mode,runs:+e.key});
  else if(e.key==='w'||e.key==='W'){ui.err='';ui.wk={how:'bowled',who:'striker',runs:0,fielder:'',nb:nextBatter(S)};render(true)}
});
window.addEventListener('hashchange',()=>render(true));
window.addEventListener('resize',fitAll);
render(true);
initSync();
})();
</script>
